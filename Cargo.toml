[workspace]
members = [
  "crates/synck-vcs",
  "crates/synck-vcs-sqlite",
  "crates/synck-file-folder",
  "crates/synck-local",
  "crates/synck-items",
]
resolver = "2"

[workspace.package]
authors = ["Jaime Rivas"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/synergyos/synck"
rust-version = "1.91.1"
version = "0.1.1"

[workspace.dependencies]
"async-trait" = "0.1"
"cap-fs-ext" = "4"
"cap-std" = "4"
"chrono" = { "features" = ["serde"], "version" = "0.4" }
"hex" = "0.4"
"ignore" = "0.4"
"num-bigint" = "0.4"
"rusqlite" = { "features" = ["backup", "bundled"], "version" = "0.39" }
"serde" = { "features" = ["derive"], "version" = "1" }
"serde_json" = "1"
"sha2" = "0.10"
"thiserror" = "2"
"tokio" = { "features" = ["macros", "rt-multi-thread"], "version" = "1" }
"tracing" = "0.1"
"uuid" = { "features" = ["v4", "v5", "v7", "serde"], "version" = "1" }
