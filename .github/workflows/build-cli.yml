name: Build CLI
run-name: CLI build (${{ github.ref_name }})

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read workspace version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

  build:
    needs: metadata
    name: Compile ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary: synck
          - target: aarch64-apple-darwin
            runner: macos-15
            binary: synck
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: synck
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: synck.exe
    defaults:
      run:
        shell: bash
    env:
      BUILD_VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BINARY: ${{ matrix.binary }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --target "$BUILD_TARGET"
      - name: Build and smoke-test the CLI
        run: |
          set -euo pipefail
          cargo +1.91.1 build --locked --release --target "$BUILD_TARGET" -p synck-local --bin synck
          binary="target/$BUILD_TARGET/release/$BUILD_BINARY"
          test "$("$binary" --version)" = "synck $BUILD_VERSION"
          "$binary" --help > /dev/null
          test -s "$binary"
          test "$(wc -c < "$binary")" -lt 2147483648
          mkdir dist
          cp "$binary" "dist/synck-$BUILD_TARGET${BUILD_BINARY#synck}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*
          archive: false
          if-no-files-found: error
          retention-days: 1
