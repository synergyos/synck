name: Public source CI

on:
  # Automatic CI is paused; run it manually when needed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The release gate: every tag passes this on all three systems.
  workspace:
    name: Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.1
      - name: Check the spec vectors
        if: runner.os == 'Linux'
        run: python3 -I scripts/generate_vectors.py --check
      - name: Test the workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Run local library example
        shell: bash
        run: cargo run --locked -p synck-local --example local_repository -- "$RUNNER_TEMP/synck-library-example"
